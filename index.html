<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Estimate your monthly mortgage payment, including taxes, insurance, PMI and HOA." />
    <title>Mortgage Calculator</title>
    <script>
      // Apply a saved theme before first paint so a returning visitor never sees a flash.
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body class="bg-surface-1 font-sans leading-[normal] text-fg">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
