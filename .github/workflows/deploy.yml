name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild daily to pick up Freddie Mac's weekly national-average rates. They're
  # normally out Thursdays at noon ET, but holiday weeks move the release.
  schedule:
    - cron: "0 21 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # GitHub disables scheduled workflows after 60 days without repo activity.
  # Re-enabling this one from its own scheduled run keeps the daily refresh going
  # when the code isn't changing. This is widely used but not documented by
  # GitHub; it warns the owner by email before disabling a schedule if it stops working.
  keepalive:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/deploy.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # A scheduled run exists only to refresh the rates, so if that fails, stop
      # and leave the live site as it is. A push still deploys; the page then
      # falls back to its built-in default rate.
      - run: npm run rates
        continue-on-error: ${{ github.event_name != 'schedule' }}

      # Property-tax rates by ZIP come from the Census Bureau's yearly survey.
      # They're cached by survey year (and by the code that builds them), so the
      # ~60 MB download only happens when a new survey is published. If the
      # Census site is down, the last cached file is used; failing that, the
      # site deploys without it and the ZIP field says local rates are unavailable.
      - name: Find newest Census survey
        id: acs
        run: echo "year=$(node scripts/build-tax-rates.ts --latest-year)" >> "$GITHUB_OUTPUT"
        continue-on-error: true
      - name: Restore tax rates
        id: tax-cache
        uses: actions/cache/restore@v6
        with:
          path: public/tax-rates.json
          key: tax-rates-${{ steps.acs.outputs.year || 'unknown' }}-${{ hashFiles('src/taxRates.ts', 'scripts/build-tax-rates.ts') }}
          restore-keys: tax-rates-
      - name: Build tax rates
        id: tax-build
        if: steps.tax-cache.outputs.cache-hit != 'true' && steps.acs.outputs.year != ''
        run: node scripts/build-tax-rates.ts ${{ steps.acs.outputs.year }}
        continue-on-error: true
      - name: Save tax rates
        if: steps.tax-build.outcome == 'success'
        uses: actions/cache/save@v6
        with:
          path: public/tax-rates.json
          key: ${{ steps.tax-cache.outputs.cache-primary-key }}

      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
